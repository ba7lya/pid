# SPDX-License-Identifier: MIT
name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/vcpkg_cache,readwrite"
  LLVM_VERSION: "23.1.1"

jobs:
  build-test:
    name: ${{ matrix.name }} ${{ matrix.config }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        config: [Debug, Release]
        include:
          - name: MSVC 2022 x64 / Windows
            os: windows-latest
            preset: MSVC-2022-x64-Ninja
            triplet: x64-windows
          - name: GCC / Linux
            os: ubuntu-latest
            preset: GCC-Linux-Ninja
            triplet: x64-linux

    steps:
      - name: Enable long paths (Windows)
        if: runner.os == 'Windows'
        run: git config --global core.longpaths true

      - name: Checkout (with vcpkg submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Enter MSVC developer environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: vcpkg_cache
          key: vcpkg-${{ matrix.triplet }}-${{ hashFiles('vcpkg.json') }}

      - name: Configure
        shell: bash
        run: |
          cmake --preset "${{ matrix.preset }}" \
            -Dba7lya.pid_BUILD_TEST=ON \
            -Dba7lya.pid_BUILD_EXAMPLES=ON \
            -Dba7lya.pid_BUILD_BENCHMARK=ON

      - name: Build
        shell: bash
        run: cmake --build --preset "${{ matrix.preset }}-${{ matrix.config }}" --parallel

      - name: Test
        shell: bash
        run: ctest --preset "${{ matrix.preset }}-Test" -C "${{ matrix.config }}"

      - name: Upload compile database
        if: always() && matrix.config == 'Release'
        uses: actions/upload-artifact@v4
        with:
          name: compile_commands-${{ matrix.triplet }}
          path: build/${{ matrix.preset }}/compile_commands.json
          if-no-files-found: ignore

  clang-format:
    name: clang-format (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned clang-format (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          # apt.llvm.org's package set for major 23 on noble does not reliably
          # provide clang-format-23 (llvm.sh exits 0 but leaves nothing), so
          # use the official pinned release archive instead - same version
          # source as the Windows MSI leg.
          curl -fsSL -o llvm.tar.xz \
            "https://github.com/llvm/llvm-project/releases/download/llvmorg-${LLVM_VERSION}/LLVM-${LLVM_VERSION}-Linux-X64.tar.xz"
          tar -xf llvm.tar.xz
          rm llvm.tar.xz
          tool=$(find "$PWD" -type f -name clang-format -path '*/bin/*' | head -1)
          if [ -z "$tool" ]; then echo "clang-format not found in archive" >&2; exit 1; fi
          lib=$(dirname "$(dirname "$tool")")/lib
          echo "CLANG_FORMAT=$tool" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"

      - name: Install pinned LLVM (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/llvm/llvm-project/releases/download/llvmorg-$env:LLVM_VERSION/LLVM-$env:LLVM_VERSION-win64.msi" -OutFile llvm.msi
          $proc = Start-Process msiexec.exe -ArgumentList '/i','llvm.msi','/qn','/norestart' -Wait -PassThru
          # 0 = success, 3010 = success with reboot request (fine on CI).
          if ($proc.ExitCode -notin 0, 3010) { throw "msiexec failed with exit code $($proc.ExitCode)" }
          $exe = Join-Path $env:ProgramFiles 'LLVM\bin\clang-format.exe'
          if (-not (Test-Path $exe)) { throw "expected $exe after MSI install" }
          "CLANG_FORMAT=$($exe -replace '\\','/')" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8NoBOM

      - name: Check formatting
        shell: bash
        run: |
          files=$(find include examples tests benchmark -name '*.cxx' -o -name '*.hxx')
          "$CLANG_FORMAT" --dry-run -Werror --style=file $files

  clang-tidy:
    name: clang-tidy (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned clang-tidy (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          # Same official pinned release archive as the clang-format job;
          # apt.llvm.org does not reliably provide clang-tidy-23 on noble.
          curl -fsSL -o llvm.tar.xz \
            "https://github.com/llvm/llvm-project/releases/download/llvmorg-${LLVM_VERSION}/LLVM-${LLVM_VERSION}-Linux-X64.tar.xz"
          tar -xf llvm.tar.xz
          rm llvm.tar.xz
          tool=$(find "$PWD" -type f -name clang-tidy -path '*/bin/*' | head -1)
          if [ -z "$tool" ]; then echo "clang-tidy not found in archive" >&2; exit 1; fi
          lib=$(dirname "$(dirname "$tool")")/lib
          echo "CLANG_TIDY=$tool" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"

      - name: Install pinned LLVM (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/llvm/llvm-project/releases/download/llvmorg-$env:LLVM_VERSION/LLVM-$env:LLVM_VERSION-win64.msi" -OutFile llvm.msi
          $proc = Start-Process msiexec.exe -ArgumentList '/i','llvm.msi','/qn','/norestart' -Wait -PassThru
          if ($proc.ExitCode -notin 0, 3010) { throw "msiexec failed with exit code $($proc.ExitCode)" }
          $exe = Join-Path $env:ProgramFiles 'LLVM\bin\clang-tidy.exe'
          if (-not (Test-Path $exe)) { throw "expected $exe after MSI install" }
          "CLANG_TIDY=$($exe -replace '\\','/')" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8NoBOM

      - name: Run clang-tidy on the public header
        shell: bash
        run: |
          # The library header only includes the standard library, so it can
          # be analyzed without a compilation database.
          "$CLANG_TIDY" include/*.hxx -- -std=c++23

# SPDX-License-Identifier: MIT
name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/vcpkg_cache,readwrite"
  LLVM_VERSION: "23.1.1"

jobs:
  build-test:
    name: ${{ matrix.name }} ${{ matrix.config }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        config: [Debug, Release]
        include:
          - name: MSVC 2022 x64 / Windows
            os: windows-latest
            preset: MSVC-2022-x64-Ninja
            triplet: x64-windows
          - name: GCC / Linux
            os: ubuntu-latest
            preset: GCC-Linux-Ninja
            triplet: x64-linux

    steps:
      - name: Enable long paths (Windows)
        if: runner.os == 'Windows'
        run: git config --global core.longpaths true

      - name: Checkout (with vcpkg submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Enter MSVC developer environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: vcpkg_cache
          key: vcpkg-${{ matrix.triplet }}-${{ hashFiles('vcpkg.json') }}

      - name: Configure
        shell: bash
        run: |
          cmake --preset "${{ matrix.preset }}" \
            -Dba7lya.pid_BUILD_TEST=ON \
            -Dba7lya.pid_BUILD_EXAMPLES=ON \
            -Dba7lya.pid_BUILD_BENCHMARK=ON

      - name: Build
        shell: bash
        run: cmake --build --preset "${{ matrix.preset }}-${{ matrix.config }}" --parallel

      - name: Test
        shell: bash
        run: ctest --preset "${{ matrix.preset }}-Test" -C "${{ matrix.config }}"

      - name: Upload compile database
        if: always() && matrix.config == 'Release'
        uses: actions/upload-artifact@v4
        with:
          name: compile_commands-${{ matrix.triplet }}
          path: build/${{ matrix.preset }}/compile_commands.json
          if-no-files-found: ignore

  clang-format:
    name: clang-format (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned clang-format (Linux)
        if: runner.os == 'Linux'
        run: |
          wget -qO- https://apt.llvm.org/llvm.sh | sudo bash -s 23
          echo "CLANG_FORMAT=clang-format-23" >> "$GITHUB_ENV"

      - name: Install pinned LLVM (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          curl -fsSL -o llvm.exe "https://github.com/llvm/llvm-project/releases/download/llvmorg-${LLVM_VERSION}/LLVM-${LLVM_VERSION}-win64.exe"
          cmd //c "start /wait /D . llvm.exe /S"
          echo "CLANG_FORMAT=C:/Program Files/LLVM/bin/clang-format.exe" >> "$GITHUB_ENV"

      - name: Check formatting
        shell: bash
        run: |
          files=$(find include examples tests benchmark -name '*.cxx' -o -name '*.hxx')
          "$CLANG_FORMAT" --dry-run -Werror --style=file $files

  clang-tidy:
    name: clang-tidy (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned clang-tidy (Linux)
        if: runner.os == 'Linux'
        run: |
          wget -qO- https://apt.llvm.org/llvm.sh | sudo bash -s 23
          echo "CLANG_TIDY=clang-tidy-23" >> "$GITHUB_ENV"

      - name: Install pinned LLVM (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          curl -fsSL -o llvm.exe "https://github.com/llvm/llvm-project/releases/download/llvmorg-${LLVM_VERSION}/LLVM-${LLVM_VERSION}-win64.exe"
          cmd //c "start /wait /D . llvm.exe /S"
          echo "CLANG_TIDY=C:/Program Files/LLVM/bin/clang-tidy.exe" >> "$GITHUB_ENV"

      - name: Run clang-tidy on the public header
        shell: bash
        run: |
          # The library header only includes the standard library, so it can
          # be analyzed without a compilation database.
          "$CLANG_TIDY" include/*.hxx -- -std=c++23
